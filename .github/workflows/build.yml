# thanks https://github.com/gvillanueva/hello-cmake-qt-github_action
name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            qt_arch: win64_msvc2022_64
            qt_host: windows
          - name: linux-x64
            os: ubuntu-26.04
            qt_arch: linux_gcc_64
            qt_host: linux

    name: build ${{matrix.name}}
    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.0'
        arch: ${{matrix.qt_arch}}
        host: ${{matrix.qt_host}}
        target: 'desktop'
        modules: qtmultimedia
        cache: true

    - name: Configure
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Package
      run: cmake --install build --config ${{env.BUILD_TYPE}} --prefix "${{github.workspace}}/dist"

    - name: Package vendor
      run: python scripts/ci-get-ffmpeg.py
    

    - name: Compress as 7z
      run: 7z a -t7z mediakit-${{matrix.name}}.7z ./dist/*

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: mediakit-${{matrix.name}}
        path: mediakit-${{matrix.name}}.7z
        if-no-files-found: error
        archive: false
